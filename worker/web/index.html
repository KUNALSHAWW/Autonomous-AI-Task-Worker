<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>proof, the task worker</title>
  <meta name="description" content="Give it a task in plain English. It does the work in your apps, then proves it.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%236E8BFF'/%3E%3Cpath d='M7 12.5l3 3 7-7' stroke='%230E1014' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/IBMPlexSans-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/app.css">
  <script>
    try { const t = localStorage.getItem("proof-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="rail" id="rail">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" fill="currentColor"/><path d="M7 12.5l3 3 7-7" stroke="var(--bg)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <b>proof</b>
        <span>task worker</span>
      </div>
      <button class="btn ghost menu" id="menu" aria-label="Show navigation">Menu</button>
      <button class="btn new" id="new-task">New task <kbd>N</kbd></button>
      <h2>Runs</h2>
      <ul class="runs" id="runs" aria-label="Runs"></ul>
      <h2>Company apps</h2>
      <ul class="apps" id="apps"></ul>
      <div class="rail-foot">
        <span class="dot" id="model-dot"></span>
        <span class="model" id="model-name">Checking model</span>
        <button class="btn ghost" id="theme" aria-label="Switch theme" title="Switch theme">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </button>
      </div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
