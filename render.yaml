services:
  - type: web
    name: ai-task-worker
    runtime: docker
    plan: free           # fits in 512 MB with EMBED_SANDBOX=1 and one run at a time
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: ollama
      - key: OLLAMA_API_KEY
        sync: false      # set in the Render dashboard, never committed
      - key: OLLAMA_MODEL
        sync: false
      - key: EMBED_SANDBOX
        value: "1"
      - key: MAX_CONCURRENT_RUNS
        value: "1"
      - key: SANDBOX_ADMIN_TOKEN
        generateValue: true
