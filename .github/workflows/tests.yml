name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Unit and end-to-end tests (scripted model, real browser, live sandbox)
        run: python -m pytest -q
